name: AI Code Review
description: >-
  Reviews the PR head commit with packages/code-reviewer and builds the PR comment, compared with
  the previous review. Posting the comment and setting labels is left to the calling workflow.
  Never fails on a fail verdict or a review error.

# Expects the default pull_request checkout (the PR merge commit) with fetch-depth: 2,
# so HEAD^1..HEAD is the whole PR against its base.
# PR title and body are untrusted: they reach shell steps only through env:, never inside run:.

inputs:
  openrouter-api-key:
    description: OpenRouter API key for the reviewer.
    required: true
  github-token:
    description: Token used by gh to read the earlier review comments.
    required: true
  pr-number:
    description: Pull request number.
    required: true
  pr-title:
    description: Pull request title (untrusted).
    required: false
    default: ''
  pr-body:
    description: Pull request description (untrusted; the reviewer caps it at 4000 characters).
    required: false
    default: ''
  head-sha:
    description: Head commit SHA of the pull request.
    required: true
  model:
    description: OpenRouter model id; empty uses the reviewer's DEFAULT_MODEL.
    required: false
    default: ''

outputs:
  outcome:
    description: passed, failed or error.
    value: ${{ steps.report.outputs.outcome }}
  comment-file:
    description: Path to the Markdown comment, ready for gh pr comment --body-file.
    value: ${{ steps.report.outputs.comment-file }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Compute PR diff
      shell: bash
      run: |
        git diff HEAD^1 HEAD -- . \
          ':(exclude)package-lock.json' \
          ':(exclude)**/package-lock.json' \
          ':(exclude)context/**' \
          > "$RUNNER_TEMP/pr.diff"
        echo "Diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"

    # Only comments written by the workflow bot count, so nobody can fake earlier scores.
    # A failed lookup only loses the comparison, so it never stops the review.
    - name: Load previous reviews
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        file="$RUNNER_TEMP/previous-comments.jsonl"
        filter='.[] | select(.user.login == "github-actions[bot]")'
        filter+=' | select(.body | startswith("<!-- ai-cr -->")) | .body | @json'
        if ! gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate --jq "$filter" > "$file"; then
          echo "::warning::Could not load earlier review comments; this review has no comparison."
          : > "$file"
        fi
        echo "Earlier reviews: $(wc -l < "$file")"

    # A non-zero exit (empty or oversized diff, API error) must not stop the action:
    # the report step turns it into an "error" outcome and a "review skipped" comment.
    - name: Run reviewer
      id: review
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        REVIEW_MODEL: ${{ inputs.model }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
      run: |
        set +e
        npm run review --silent -w @ai-pr-reviewer/code-reviewer \
          < "$RUNNER_TEMP/pr.diff" \
          > "$RUNNER_TEMP/review.out" \
          2> "$RUNNER_TEMP/review.err"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "Review exit code: $code"
        # stderr holds the cost line (or the error); show it in the job log.
        cat "$RUNNER_TEMP/review.err" >&2

    # The same report goes to the job summary, so it is readable on the run page too.
    - name: Build review report
      id: report
      shell: bash
      env:
        REVIEW_STDOUT_FILE: ${{ runner.temp }}/review.out
        REVIEW_STDERR_FILE: ${{ runner.temp }}/review.err
        REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit-code }}
        PREVIOUS_COMMENTS_FILE: ${{ runner.temp }}/previous-comments.jsonl
        HEAD_SHA: ${{ inputs.head-sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        COMMENT_FILE: ${{ runner.temp }}/comment.md
      run: |
        outcome=$(npm run ci-report --silent -w @ai-pr-reviewer/code-reviewer)
        echo "Outcome: $outcome"
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        echo "comment-file=$COMMENT_FILE" >> "$GITHUB_OUTPUT"
        cat "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"
